name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela corridas viejas de la misma rama/PR cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos por defecto. Cada job pide lo que necesita de más (el de
# CodeQL necesita `security-events: write`). Sin esto, el GITHUB_TOKEN viene con
# permisos de escritura sobre el repositorio en muchas configuraciones, y una
# acción comprometida podría usarlos.
permissions:
  contents: read

jobs:
  app:
    name: App (typecheck · tests · build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nutricionista
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nutricionista
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutricionista"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nutricionista:ci@localhost:5432/nutricionista?schema=public
      # Secretos ficticios: la CI no habla con servicios reales, solo compila y testea.
      AUTH_SECRET: ci-auth-secret-no-usar-en-produccion
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      TOKENS_SECRET: ci-tokens-secret-no-usar-en-produccion
      NODE_ENV: test

    steps:
      # Las acciones van fijadas por SHA y no por tag.
      #
      # Un tag como `v4` es MUTABLE: quien controla el repositorio de la acción
      # puede reapuntarlo a otro commit cuando quiera. Si esa cuenta se
      # compromete, la próxima corrida de este workflow ejecuta código ajeno —y
      # el workflow de despliegue lo hace con la clave SSH del VPS de
      # producción. El SHA no se puede reapuntar.
      #
      # El comentario al lado deja legible qué versión es cada SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # --- Seguridad de la cadena de suministro --------------------------------
      #
      # Va ANTES de compilar: si hay un aviso alto o crítico en algo que llega a
      # producción, la corrida tiene que fallar rápido y ruidosamente. Esta es
      # la red que faltaba: cuando se hizo la auditoría había 4 avisos críticos
      # abiertos —uno en la propia biblioteca de autenticación— y nada en el CI
      # los veía.
      #
      # `--omit=dev` es deliberado: acota la exigencia a lo que se despliega. Un
      # fallo en el runner de tests no es un riesgo de producción y no debe
      # frenar el trabajo de nadie. Lo de desarrollo se revisa en el paso
      # siguiente, que informa pero no rompe.
      - name: Auditoría de dependencias de producción
        run: npm audit --audit-level=high --omit=dev

      - name: Auditoría completa (informativa, incluye desarrollo)
        run: npm audit || true

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Typecheck (tsc estricto)
        run: npx tsc --noEmit

      # Va DESPUÉS de `prisma generate` porque las reglas type-aware
      # (no-floating-promises y compañía) necesitan los tipos del cliente
      # generado para resolver los repositorios.
      #
      # `--max-warnings` no se fija todavía: quedan 36 avisos conocidos y
      # anotados como deuda (reglas del React Compiler y no-base-to-string, ver
      # audits/AUDIT_CALIDAD_CODIGO.md). Los ERRORES sí rompen la corrida, que
      # es lo que impide que la base se degrade desde hoy.
      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npx vitest run

      - name: Build (next)
        run: npx next build

  # --- Análisis estático de seguridad ---------------------------------------
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necesario para publicar los hallazgos en la pestaña Security.
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `security-extended` agrega las consultas de inyección, XSS y
          # travesía de rutas que no trae el conjunto por defecto.
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@v3

  # --- Búsqueda de secretos en el historial ---------------------------------
  #
  # Hoy el historial está limpio (se verificó en la auditoría). Este paso existe
  # para que siga estándolo: es mucho más barato frenar un secreto en el PR que
  # rotarlo después de que quedó en un commit público.
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks necesita el historial completo, no solo el último commit.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: Servicio de nutrición (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nutricion-servicio

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
          cache-dependency-path: nutricion-servicio/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
