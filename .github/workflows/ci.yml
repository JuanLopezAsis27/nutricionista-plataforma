name: CI

# Dos carriles:
#   PR  → development  ·  gate antes de que el código llegue al servidor de pruebas
#   push a development ·  valida el estado integrado Y despliega a STAGING
#   PR  → main         ·  gate antes de producción
#   push a main        ·  valida y despliega a PRODUCCIÓN
#
# NO hace falta listar `feature/**`: el filtro de `pull_request` es por rama
# BASE, no por la de origen, así que un PR desde cualquier rama hacia
# development ya dispara. Agregarlas además en `push` sólo duplicaría corridas
# (el grupo de `concurrency` no las deduplica: un push a la rama y el evento del
# PR tienen `github.ref` distintos) y pagaría dos veces CodeQL y gitleaks.
#
# Hasta ahora esto escuchaba SÓLO a `main`, mientras todo el trabajo ocurría en
# `development` —67 commits de diferencia—, así que ningún cambio reciente pasó
# por typecheck, tests ni análisis de seguridad.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Cancela corridas viejas de la misma rama/PR cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos por defecto. Cada job pide lo que necesita de más (el de
# CodeQL necesita `security-events: write`). Sin esto, el GITHUB_TOKEN viene con
# permisos de escritura sobre el repositorio en muchas configuraciones, y una
# acción comprometida podría usarlos.
permissions:
  contents: read

jobs:
  app:
    name: App (typecheck · tests · build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nutricionista
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nutricionista
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutricionista"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nutricionista:ci@localhost:5432/nutricionista?schema=public
      # Secretos ficticios: la CI no habla con servicios reales, solo compila y testea.
      AUTH_SECRET: ci-auth-secret-no-usar-en-produccion
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      TOKENS_SECRET: ci-tokens-secret-no-usar-en-produccion
      NODE_ENV: test

    steps:
      # Las acciones van fijadas por SHA y no por tag.
      #
      # Un tag como `v4` es MUTABLE: quien controla el repositorio de la acción
      # puede reapuntarlo a otro commit cuando quiera. Si esa cuenta se
      # compromete, la próxima corrida de este workflow ejecuta código ajeno —y
      # el workflow de despliegue lo hace con la clave SSH del VPS de
      # producción. El SHA no se puede reapuntar.
      #
      # El comentario al lado deja legible qué versión es cada SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # La versión de Node debe coincidir con la del Dockerfile
      # (node:22-bookworm-slim) y con la del archivo `.nvmrc`.
      #
      # No es una preferencia de estilo: `npm ci` EXIGE que el lock haya sido
      # generado por una versión compatible de npm. Node 22 trae npm 10 y Node
      # 24 trae npm 11, y ambos escriben el lock distinto para el bloque
      # `overrides` de este proyecto. Cuando el lock se generó con npm 11 y el
      # build corrió con npm 10, `npm ci` abortó con
      # "Missing: nodemailer@8.0.11 from lock file" — la imagen no se podía
      # construir. Nadie lo detectó porque el CI no corría sobre `development`.
      #
      # Si algún día se sube a Node 24, hay que subir los tres lugares a la vez
      # y regenerar el lock con esa versión.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Guarda automática de lo anterior. Que `.nvmrc` y el `Dockerfile` digan lo
      # mismo no puede depender de que alguien se acuerde: el desajuste no da
      # error hasta que falla el build, y falla lejos de donde se causó.
      - name: Verificar que .nvmrc y el Dockerfile coincidan
        run: |
          nvmrc="$(tr -d '[:space:]' < .nvmrc)"
          dockerfile="$(grep -m1 -oE 'FROM node:[0-9]+' Dockerfile | grep -oE '[0-9]+')"
          echo ".nvmrc=$nvmrc  Dockerfile=$dockerfile"
          if [ "$nvmrc" != "$dockerfile" ]; then
            echo "::error::.nvmrc dice Node $nvmrc pero el Dockerfile usa Node $dockerfile."
            echo "::error::Tienen que coincidir: npm 10 (Node 22) y npm 11 (Node 24) escriben"
            echo "::error::distinto el lock, y 'npm ci' falla con 'Missing: <paquete> from lock file'."
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      # --- Seguridad de la cadena de suministro --------------------------------
      #
      # Va ANTES de compilar: si hay un aviso alto o crítico en algo que llega a
      # producción, la corrida tiene que fallar rápido y ruidosamente. Esta es
      # la red que faltaba: cuando se hizo la auditoría había 4 avisos críticos
      # abiertos —uno en la propia biblioteca de autenticación— y nada en el CI
      # los veía.
      #
      # `--omit=dev` es deliberado: acota la exigencia a lo que se despliega. Un
      # fallo en el runner de tests no es un riesgo de producción y no debe
      # frenar el trabajo de nadie. Lo de desarrollo se revisa en el paso
      # siguiente, que informa pero no rompe.
      - name: Auditoría de dependencias de producción
        run: npm audit --audit-level=high --omit=dev

      - name: Auditoría completa (informativa, incluye desarrollo)
        run: npm audit || true

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Typecheck (tsc estricto)
        run: npx tsc --noEmit

      # Va DESPUÉS de `prisma generate` porque las reglas type-aware
      # (no-floating-promises y compañía) necesitan los tipos del cliente
      # generado para resolver los repositorios.
      #
      # `--max-warnings` no se fija todavía: quedan 36 avisos conocidos y
      # anotados como deuda (reglas del React Compiler y no-base-to-string, ver
      # audits/AUDIT_CALIDAD_CODIGO.md). Los ERRORES sí rompen la corrida, que
      # es lo que impide que la base se degrade desde hoy.
      - name: Lint (eslint)
        run: npm run lint

      - name: Formato (prettier)
        run: npm run formato

      # Las métricas de respaldo las consume un Prometheus que vive en OTRO
      # repositorio (`monitoreo`). Un renombre acá no rompe nada visible: la
      # alerta del otro lado simplemente deja de encontrar la métrica y no
      # dispara nunca más. Son las alertas de RESPALDOS, así que el modo de falla
      # es creer que estás cubierto y no estarlo.
      #
      # Este check convierte ese silencio en un CI rojo, en el repositorio y en
      # el momento donde se causó.
      - name: Verificar el contrato de métricas
        run: node scripts/verificar-contrato-metricas.mjs

      - name: Tests (vitest)
        run: npx vitest run

      - name: Build (next)
        run: npx next build

  # --- Análisis estático de seguridad ---------------------------------------
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necesario para publicar los hallazgos en la pestaña Security.
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `security-extended` agrega las consultas de inyección, XSS y
          # travesía de rutas que no trae el conjunto por defecto.
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@v3

  # --- Búsqueda de secretos en el historial ---------------------------------
  #
  # Hoy el historial está limpio (se verificó en la auditoría). Este paso existe
  # para que siga estándolo: es mucho más barato frenar un secreto en el PR que
  # rotarlo después de que quedó en un commit público.
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks necesita el historial completo, no solo el último commit.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # El job `go` (servicio de nutrición) se eliminó: el directorio
  # `nutricion-servicio/` ya no existe —se borró en el commit 73a66e7— así que
  # el job fallaba por un `working-directory` inexistente. Todavía figura en la
  # rama `main`, que quedó atrasada; al mergear se va con este cambio.

  # --- Servicio de ML (Python) ----------------------------------------------
  ml:
    name: Servicio de ML (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-servicio

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml-servicio/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Compila todos los módulos: detecta errores de sintaxis y de importación
      # sin necesidad de una base de datos.
      - name: Compilar
        run: python -m compileall -q .

      # Arranca el servicio de verdad y comprueba que responda. Es la prueba que
      # habría detectado que `/insights` estaba roto: el servicio devolvía 200
      # con un mensaje de degradación mientras la consulta fallaba contra una
      # columna eliminada por una migración.
      - name: Humo (arranca y responde)
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/docs >/dev/null && break
            sleep 1
          done
          curl -sf -X POST http://127.0.0.1:8000/insights \
            -H 'content-type: application/json' \
            -d '{"nutricionistaId":"ci"}' | tee /tmp/respuesta.json
          grep -q '"tipo"' /tmp/respuesta.json

  # --- Construcción y publicación de imágenes -------------------------------
  #
  # Acá se compila lo que va a correr en producción. Antes se compilaba EN EL
  # VPS durante el despliegue, lo que tenía dos consecuencias malas:
  #
  #   1. `npm ci` + `next build` competían por CPU y RAM con el Postgres que
  #      atiende a los pacientes, en el peor momento (durante un despliegue).
  #   2. No había rollback: la imagen anterior quedaba sin etiqueta y volver
  #      atrás significaba recompilar desde cero en un servidor ya degradado.
  #
  # Cada imagen se etiqueta con el SHA del commit —inmutable— y además con el
  # nombre de la rama, que sirve de alias móvil para inspección manual.
  #
  # También cubre el hueco de que el CI validaba con `next build` pero nunca
  # ejercitaba el Dockerfile: los stages `runner`, `worker` y `migrator` (copia
  # de .next/standalone, engine de Prisma, usuario sin privilegios) se
  # estrenaban recién en el servidor.
  imagenes:
    name: Imágenes (build · push)
    needs: [app]
    # En los PR se CONSTRUYE (para validar el Dockerfile) pero no se publica.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - componente: app
            contexto: .
            target: runner
          - componente: worker
            contexto: .
            target: worker
          - componente: migrate
            contexto: .
            target: migrator
          - componente: respaldo
            contexto: ./respaldos
            target: respaldo
          # Se construye y publica aunque el servicio esté detrás del perfil
          # `ml` y no arranque todavía: así la imagen ya existe el día que se
          # habilite, sin tener que esperar un despliegue.
          - componente: ml
            contexto: ./ml-servicio
            target: base

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Sólo se inicia sesión cuando se va a publicar. En un PR desde un fork,
      # el token no tiene permiso de escritura y este paso se saltea.
      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El nombre del repositorio puede tener mayúsculas; las rutas de imagen no.
      - name: Calcular nombre de la imagen
        id: nombre
        run: echo "ruta=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.componente }}" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar (${{ matrix.componente }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.contexto }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.nombre.outputs.ruta }}:${{ github.sha }}
            ${{ steps.nombre.outputs.ruta }}:${{ github.ref_name }}
          # Caché entre corridas: sin esto, cada build reinstala node_modules
          # desde cero y el pipeline se vuelve demasiado lento para usarlo.
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,scope=${{ matrix.componente }},mode=max

  # --- Despliegue -----------------------------------------------------------
  #
  # Va acá y no en un workflow aparte a propósito. Con `needs`, es
  # IMPOSIBLE desplegar algo que no pasó el CI: GitHub no ejecuta este job si
  # cualquiera de los anteriores falló.
  #
  # La alternativa habitual —un workflow separado con `workflow_run`— tiene
  # semántica traicionera: lee el archivo desde la rama por defecto (acá `main`,
  # que está atrasada) y `github.sha` no apunta a lo que uno espera. No compensa
  # a esta escala.
  #
  # Dos carriles, un solo bloque de pasos:
  #   push a development → environment `staging`     (automático)
  #   push a main        → environment `produccion`  (con aprobación)
  #
  # Los secrets se resuelven POR ENVIRONMENT: mismos nombres, valores distintos.
  # Eso elimina cualquier if/else de conexión y permite una clave SSH propia por
  # servidor —que la de staging se filtre no da acceso a producción—.
  #
  # Configuración necesaria una sola vez, en Settings → Environments:
  #   produccion → VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH
  #                + "Required reviewers" (aprobación manual)
  #   staging    → los mismos cuatro, apuntando al VPS de pruebas
  desplegar:
    name: Desplegar (${{ github.ref_name == 'main' && 'producción' || 'staging' }})
    needs: [app, codeql, secretos, ml, imagenes]
    # Sólo en push (un merge). En los PR no se despliega nada.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'produccion' || 'staging' }}
    permissions:
      contents: read
      # Para que el VPS pueda descargar las imágenes publicadas recién.
      packages: read
    # Nunca dos despliegues simultáneos al MISMO entorno; staging y producción
    # no se bloquean entre sí.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Calcular raíz del registry
        id: reg
        run: echo "ruta=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Conectar por SSH y desplegar
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # `envs` reenvía estas variables al shell remoto en vez de
          # interpolarlas dentro del script, que es lo que evita que un valor
          # con caracteres raros se convierta en comandos en el servidor.
          envs: IMAGE_TAG,REGISTRO,GHCR_USUARIO,GHCR_TOKEN,ENTORNO
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"

            # Se despliega el SHA EXACTO que validó el CI, no "lo último de la
            # rama". Antes esto era un `git pull` dentro de desplegar.sh, que
            # traía cualquier commit llegado mientras tanto: lo que corría en el
            # servidor no era necesariamente lo que se testeó.
            #
            # El checkout ya sólo aporta el compose y los scripts; el CÓDIGO va
            # dentro de las imágenes, etiquetadas con este mismo SHA.
            git fetch --prune origin
            git checkout --detach "$IMAGE_TAG"

            # Credencial efímera: el GITHUB_TOKEN vale lo que dura este job, así
            # que no queda una contraseña de larga vida guardada en el servidor.
            # Para operar a mano desde el VPS hace falta un `docker login ghcr.io`
            # propio (ver docs/DESPLIEGUE.md).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USUARIO" --password-stdin

            ./scripts/desplegar.sh "$ENTORNO"

            docker logout ghcr.io >/dev/null 2>&1 || true
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRO: ${{ steps.reg.outputs.ruta }}
          GHCR_USUARIO: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENTORNO: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
