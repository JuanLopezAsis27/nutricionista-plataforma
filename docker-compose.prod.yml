# Docker Compose de PRODUCCIÓN: despliega toda la aplicación en un servidor.
#
#   1. Copiá .env.example a .env y completá los valores (sobre todo AUTH_SECRET).
#   2. Levantá todo:   docker compose -f docker-compose.prod.yml up -d --build
#   3. (Opcional) sembrá el primer nutricionista:
#        docker compose -f docker-compose.prod.yml run --rm migrate npm run db:seed
#
# Flujo de arranque:
#   postgres (sano) → migrate (aplica migraciones, one-shot) → app (Next.js)

services:
  postgres:
    image: postgres:18
    container_name: nutricionista_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Layout clásico del directorio de datos (compatible con postgres:18).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio one-shot: aplica las migraciones y termina.
  migrate:
    build:
      context: .
      target: migrator
    image: nutricionista-app-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Aplicación Next.js (servidor autónomo).
  app:
    build:
      context: .
      target: runner
    image: nutricionista-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      # Necesario detrás de un proxy/servidor para que Auth.js confíe en el host.
      AUTH_TRUST_HOST: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  datos_postgres:
    name: nutricionista_datos_postgres_prod
